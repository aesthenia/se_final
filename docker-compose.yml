services:
  db:
    image: postgres:15-alpine
    container_name: postgres_final
    restart: always
    environment:
      POSTGRES_DB: se_final
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d se_final"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: spring_final_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/se_final
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_FLYWAY_ENABLED: true
    depends_on:
      db:
        condition: service_healthy